<body>
    

    <div class="buttons">
    <button>Red</button>

    <script>

            //     item.addEventListener("click",(e) =>{

                // });
                
            let items = document.querySelector(".buttons");
        
            items.addEventListener("click",(e) =>{

                    if(e.target.tagName === "BUTTON"){

                        e.target.style.backgroundColor =
                        e.target.innerText.toLowerCase();

                    }

                
            })            
        



    </script>



</body>
