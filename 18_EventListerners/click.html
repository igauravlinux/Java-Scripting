<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Listeners</title>
</head>
<body>
    
    <!-- click event -->
    <button onclick="alert('hey this is event')">click me</button>


    <!-- mouse event -->
    <div onmouseover="this.style.background = 'yellow' " onmouseout="this.style.background = 'blue' " style="width: 200px; height: 100px; border: 2px solid;margin-top: 20px;">

    </div>

    <!-- keyboard event -->
    <input type="text" onkeydown="console.log('key down')" onkeyup="console.log('key up')">


</body>
</html>
