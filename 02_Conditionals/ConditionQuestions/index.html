<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: silver;
    }
    .container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 2rem 3rem;
      background-color: #fff;
      border-radius: 10px;
      display: flex;
      justify-content: center;
    }
    form{
      display: flex;
      flex-direction: column;
      justify-content: center;
        width: 100%;
    }
    label{
      margin-bottom: 5px;
        display: block;
    }
    .input-groups{
        width: 200px;
        margin-top: 10px;
    }
    input{
      padding: 5px;
      width: 100%;
    }
    button{
       background-color: #202940;
    color: white;
    padding: .3rem 30px;
    font-family: "Poppins";
    font-size: 1rem;
    border-radius: 4px;
    margin-top: 20px;
    }
  </style>

  <body>
    <div class="container">

      <form action="">

        <h1 id="result" style="text-align: center; margin-bottom: 20px;">00:00</h1>

        <div class="input-groups">
          <label for="first-num">First Number</label>
          <input type="number" id="first-num" />
        </div>

        <div class="input-groups">
          <label for="sec-num">Second Number</label>
          <input type="number" id="sec-num" />
        </div>

        <button onclick="checkNumber()" type="button">Check</button>
      </form>
    </div>

    <script src="./max.js"></script>
    <!-- <script src="./oddEven.js"></script> -->
  </body>
</html>
