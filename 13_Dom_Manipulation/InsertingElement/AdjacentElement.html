<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      insertAdjacentElement() Ye exact position par insert karta hai.
    </title>

    <style>
      .box {
        width: 100px;
        height: 100px;
        background-color: slateblue;
      }
    </style>
  </head>
  <body>
    <div class="box">Hello</div>

    <script>
    let box = document.getElementsByClassName("box")[0];  
    let h1 = document.createElement("h1");
    h1.textContent = "Heading";

    box.insertAdjacentElement("afterend", h1);


    </script>
  </body>
</html>
