<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- getElementById() -->

    <div>
        <p id="message">Javascript Dom</p>
        <p id="message">Javascript</p>
    </div>
    
    <!-- getElementsByName() -->

    <div>
        <input type="radio" name="language" value="JS">
        <input type="radio" name="language" value="Python">
    </div>


    <!-- getElementsByTagName() -->

    <h1>First heading</h1>
    <h1>Second heading</h1>
    <h1>Third heading</h1>
    <h1>Fourth heading</h1>
    <p>dfgweyg</p>


    <!-- getElementsByClassName() -->

    <h1 class="msg">First heading</h1>
    <div id="container">
        <h1 class="msg">Second heading</h1>
        <h1 class="msg">Third heading</h1>
    </div>


    <!-- querySelector() -->
    <input type="text" placeholder="Enter your Name" class="nameFeild">



    <!-- querySelectorAll() -->
     <h1 class="Name">Hey i'm Gaurav Kumar</h1>
     <h1 class="Name">Hey i'm Rahul Kumar</h1>
     <h1 class="Name">Hey i'm Prakash Kumar</h1>

    <script src="selectingElements.js"></script>
</body>
</html>
