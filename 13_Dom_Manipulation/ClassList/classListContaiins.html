<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contains</title>
</head>
<body>

    <!-- classList.contains() -->
    

    <h1 id="name">Hey this is gaurav</h1>


    <script>
        let name = document.getElementById("name");
    
            if(name.classList.contains("foo")){
                alert("name contains foo class")                
            }else{
                alert("there is no foo class in name")
            }
    </script>


</body>
</html>
