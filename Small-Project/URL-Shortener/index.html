<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Url Shortener</title>
    <link rel="stylesheet" href="style.css">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body style="background-color: #1D283B;" class="flex justify-center items-center w-full min-h-screen">
    

    <div class="bg-slate-50 w-[650px]  h-[400px] max-w-[800px] p-[30px]">

        <h1 class="text-2xl font-bold mb-6 text-center">URL Shortener</h1>

        <div class="flex gap-3">

            <input type="text" id="longUrl" placeholder="Paste your URL here... (e.g. https://mysite.com/very-long-page)" class="border text-[18px] p-3 w-full pr-[50px] text-ellipsis">

            <button type="submit" id="shortenBtn" class="border w-[240px] px-3 cursor-pointer active:bg-black active:text-white">Shorten now</button>

        </div>

        <input type="text" readonly id="shortUrl" class="border mt-[30px] p-3 text-[18px] w-full" placeholder="Short URL will appear here....">

        <button type="submit" id="copyBtn" class="border w-[200px]  px-3 mt-[30px] p-3 cursor-pointer active:bg-black active:text-white" disabled>Copy Link</button>



    </div>
    


    <script src="app.js"></script>
</body>
</html>
