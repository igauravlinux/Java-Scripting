<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>

    <div id="container">
        <div class="heading trasnparency">
            <h1>Weather App</h1>
        </div>

        <div class="input-feild trasnparency">
            <i class="ri-search-line"></i>
            <input type="text" placeholder="Enter a city name">
        </div>

        <div class="info-box trasnparency">

            <div class="left">
                <h1 class="day">Monday</h1>

                <div class="month">

                </div>

                <p>Precipitation: 0%</p>
            </div>


            <div class="middle">
                <h1 class="humidity">0%</h1>
            </div>


            <div class="right">
                <div class="weather-icon">

                </div>

                <p class="wind-spedd">0.00/ms</p>
            </div>


        </div>


    </div>




    
</body>
</html>
