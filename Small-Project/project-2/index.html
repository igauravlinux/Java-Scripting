<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>

    <div id="container">
        
        <div class="input-group">
            <input type="text" id="input-feild" placeholder="Search">
            <button id="search">
                 <i class="ri-search-line"></i>
            </button>
        </div>


        <img src="./assets/rainy-day_6205776.png" height="100px">


        <h1 id="degree">00</h1>


        <div id="info">
            <h3 id="city">city,</h3>
            <h3 id="country">country</h3>
        </div>


        <div class="humid-box">
            <p id="humidity">28%</p>
            <p>humidity</p>
        </div>

        <div class="wind-box">
            <p id="wind">28:12</p>
            <p>Wind Speed</p>
        </div>

    </div>


    <script src="app.js"></script>

    
</body>
</html>
